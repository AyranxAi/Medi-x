    <rect x="804" y="1412" width="140" height="56" rx="28" fill="#5C1F31"/>
    <text x="846" y="1446" font-family="MediGyn NOW" font-size="12" font-weight="500" letter-spacing="2.4" fill="#FAF7F1">JOIN</text>
  </g>

  <g id="chip-gold">
    <rect x="1000" y="1412" width="200" height="56" rx="28" fill="none" stroke="#C2A05E"/>
    <text x="1030" y="1446" font-family="MediGyn NOW" font-size="12" font-weight="500" letter-spacing="2.4" fill="#8A6A34">GOLD ACCENT</text>
  </g>

  <text x="80" y="1552" font-family="MediGyn NOW" font-size="13" fill="#6A585F">Pills are full-radius (999px) · 1px strokes · uppercase 12px Medium with 2.4 tracking · gold arrow accents · hairlines use “line” #DED4C2</text>
  <rect x="80" y="1576" width="1280" height="1" fill="#DED4C2"/>
