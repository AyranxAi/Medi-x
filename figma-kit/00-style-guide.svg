  <!-- typography -->
  <text x="80" y="560" font-family="MediGyn NOW" font-size="13" font-weight="700" letter-spacing="2.6" fill="#8A6A34">TYPOGRAPHY</text>

  <text x="80" y="640" font-family="Playfair" font-size="64" font-weight="450" fill="#2E2228">Playfair — editorial headlines.</text>
  <text x="80" y="686" font-family="Playfair" font-size="34" font-weight="450" font-style="italic" fill="#5C1F31">The italic carries the accent words.</text>
  <text x="80" y="716" font-family="MediGyn NOW" font-size="13" fill="#6A585F">Google Fonts “Playfair” (variable) · weight 450 · low optical size (opsz 30) · used for h1/h2 display and section titles</text>

  <text x="80" y="792" font-family="MediGyn NOW" font-size="30" font-weight="300" fill="#2E2228">MediGyn NOW Light 300 — supporting lines</text>
  <text x="80" y="836" font-family="MediGyn NOW" font-size="30" fill="#2E2228">MediGyn NOW Regular 400 — body copy</text>
  <text x="80" y="880" font-family="MediGyn NOW" font-size="30" font-weight="500" fill="#2E2228">MediGyn NOW Medium 500 — UI, card titles</text>
  <text x="80" y="924" font-family="MediGyn NOW" font-size="30" font-weight="700" fill="#2E2228">MediGyn NOW Bold 700 — emphasis, labels</text>
  <text x="80" y="954" font-family="MediGyn NOW" font-size="13" fill="#6A585F">Self-hosted brand face (fonts/ in the kit) · everything functional: nav, body, buttons, forms, captions</text>

  <text x="80" y="1022" font-family="MediGyn Megante" font-size="34" fill="#5C1F31">MediGyn Megante — brand accent &amp; chapter identifiers</text>
  <text x="80" y="1052" font-family="MediGyn NOW" font-size="13" fill="#6A585F">Self-hosted brand face (fonts/ in the kit) · chapter numbers, brand accents — verify licence before wider distribution</text>

  <text x="80" y="1118" font-family="Cormorant Garamond" font-size="34" font-style="italic" font-weight="500" fill="#2E2228">“Cormorant Garamond italic — reserved for the pull quotes.”</text>
  <text x="80" y="1148" font-family="MediGyn NOW" font-size="13" fill="#6A585F">Google Fonts · italic 300 / 500 only · testimonial and chapter-08 quotes</text>

  <!-- text scale -->
  <text x="80" y="1216" font-family="MediGyn NOW" font-size="13" font-weight="700" letter-spacing="2.6" fill="#8A6A34">SCALE (DESKTOP)</text>
  <text x="80"  y="1262" font-family="MediGyn NOW" font-size="15" fill="#2E2228">Display 72–96 · clamp( )</text>
  <text x="380" y="1262" font-family="MediGyn NOW" font-size="15" fill="#2E2228">H2 40–48</text>
  <text x="580" y="1262" font-family="MediGyn NOW" font-size="15" fill="#2E2228">H3 21–28</text>
  <text x="780" y="1262" font-family="MediGyn NOW" font-size="15" fill="#2E2228">Body 16–17</text>
  <text x="990" y="1262" font-family="MediGyn NOW" font-size="15" fill="#2E2228">Caption 13</text>
  <text x="1190" y="1262" font-family="MediGyn NOW" font-size="15" fill="#2E2228">Kicker 12 / +2.4 tracking</text>

  <!-- buttons -->
  <text x="80" y="1344" font-family="MediGyn NOW" font-size="13" font-weight="700" letter-spacing="2.6" fill="#8A6A34">BUTTONS</text>

  <g id="cta-on-photo">
    <rect x="80" y="1376" width="360" height="128" rx="12" fill="#2E2228"/>
    <rect x="112" y="1412" width="296" height="56" rx="28" fill="rgb(46,34,40)" fill-opacity="0.7" stroke="#FAF7F1" stroke-opacity="0.35"/>
    <text x="140" y="1446" font-family="MediGyn NOW" font-size="12" font-weight="500" letter-spacing="2.4" fill="#FAF7F1">BOOK YOUR CONSULTATION</text>
    <text x="382" y="1446" font-family="MediGyn NOW" font-size="14" fill="#C2A05E">→</text>
  </g>

  <g id="cta-outline">
    <rect x="496" y="1412" width="252" height="56" rx="28" fill="none" stroke="#5C1F31"/>
    <text x="526" y="1446" font-family="MediGyn NOW" font-size="12" font-weight="500" letter-spacing="2.4" fill="#5C1F31">MEET THE TEAM</text>
    <text x="700" y="1446" font-family="MediGyn NOW" font-size="14" fill="#5C1F31">→</text>
  </g>

